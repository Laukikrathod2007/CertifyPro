<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CertifyPro – Certificate Studio</title>
  <meta name="description" content="Generate and email personalized certificates in bulk.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #030712;
      --glass-bg: rgba(15, 23, 42, 0.8);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.2);
      --green: #10b981;
      --red: #f43f5e;
      --amber: #f59e0b;
      --radius: 20px;
    }
    
    html, body { 
      height: 100vh; 
      font-family: 'Inter', sans-serif; 
      background: #030712;
      color: var(--text); 
      font-size: 14px; 
      overflow: hidden;
    }
    
    #app { 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
    }
       header { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 16px 32px; 
      background: var(--glass-bg);
      backdrop-filter: blur(24px); 
      border-bottom: 1px solid var(--glass-border);
      z-index: 100;
    }
    
    .logo { display: flex; align-items: center; gap: 16px; }
    .logo img { height: 54px; width: auto; filter: drop-shadow(0 0 10px rgba(37, 99, 235, 0.2)); }
    .logo-text { font-weight: 800; font-size: 24px; letter-spacing: -0.03em; color: #fff; }
    
    #healthStatus { 
      font-size: 12px; 
      font-weight: 700; 
      padding: 8px 20px; 
      border-radius: 50px; 
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-ok { background: rgba(16, 185, 129, 0.1); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.2); }
    .status-warn { background: rgba(245, 158, 11, 0.1); color: var(--amber); border: 1px solid rgba(245, 158, 11, 0.2); }
    
    main { display: flex; flex: 1; overflow: hidden; padding: 24px; gap: 24px; max-height: calc(100vh - 84px); }
    
    /* Sidebar */
    #sidebar { 
      width: 440px; 
      min-width: 440px; 
      overflow-y: auto; 
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .section { 
      padding: 24px; 
      background: rgba(255, 255, 255, 0.02); 
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 16px;
    }
    
    .section-title { 
      font-size: 14px; 
      font-weight: 800; 
      color: #fff; 
      margin-bottom: 24px; 
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0.9;
    }
    
    label { display: block; font-size: 11px; font-weight: 800; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
    
    input[type=text], textarea, select {
      width: 100%; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--glass-border); 
      border-radius: 12px; padding: 12px 16px; color: var(--text); font-size: 14px; outline: none; transition: 0.2s;
    }
    input[type=text]:focus, textarea:focus, select:focus { border-color: var(--accent); background: rgba(0, 0, 0, 0.4); }
    
    .file-input-box {
      border: 2px dashed var(--glass-border); border-radius: 16px; padding: 20px; text-align: center; cursor: pointer; transition: 0.3s;
    }
    .file-input-box:hover { border-color: var(--accent); background: rgba(255, 255, 255, 0.02); }
    
    .btn { 
      padding: 14px 24px; border-radius: 14px; font-weight: 700; font-size: 14px; border: none; cursor: pointer; transition: 0.3s; width: 100%;
    }
    .btn-blue { background: #2563eb; color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
    .btn-green { background: #10b981; color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
    .btn-red { background: rgba(244, 63, 94, 0.1); color: var(--red); border: 1px solid var(--red); }
    .btn-ghost { background: rgba(255, 255, 255, 0.05); color: var(--text); border: 1px solid var(--glass-border); }
    .btn:hover { transform: translateY(-2px); opacity: 0.9; }

    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }

    .stat-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: rgba(0, 0, 0, 0.2); padding: 16px; border-radius: 12px; text-align: center; border: 1px solid var(--glass-border); }
    .stat-val { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
    .stat-label { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; }

    /* Right Container */
    #content { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      gap: 24px; 
      overflow: hidden; /* Prevent parent from scrolling, let children handle it */
    }
    
    .panel { 
      background: var(--glass-bg); 
      backdrop-filter: blur(16px); 
      border: 1px solid var(--glass-border); 
      border-radius: var(--radius); 
      padding: 24px;
      display: flex;
      flex-direction: column;
    }
    
    #previewPanel { align-items: center; flex-shrink: 0; }

    #certCanvas { 
      background: #0f172a; border-radius: 8px; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6); border: 1px solid var(--glass-border);
      max-width: 100%; height: auto; cursor: crosshair;
    }

    #tableSection { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #tableTitle { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-shrink: 0; }
    #tableWrap { 
      width: 100%; flex: 1; overflow-y: auto; background: rgba(0, 0, 0, 0.3); border-radius: 16px; border: 1px solid var(--glass-border);
    }
    
    table { width: 100%; border-collapse: separate; border-spacing: 0; }
    th { text-align: left; padding: 16px 24px; background: rgba(15, 23, 42, 0.9); font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--glass-border); backdrop-filter: blur(8px); }
    td { padding: 16px 24px; border-bottom: 1px solid var(--glass-border); font-size: 13px; color: #e2e8f0; }
    tr:hover td { background: rgba(255, 255, 255, 0.03); }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

    #toast { position: fixed; bottom: 32px; right: 32px; padding: 16px 32px; border-radius: 12px; font-weight: 700; opacity: 0; transition: 0.3s; transform: translateY(20px); z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); pointer-events: none; }
    #toast.show { opacity: 1; transform: translateY(0); }
    .toast-ok { background: #10b981; color: white; }
    .toast-err { background: #f43f5e; color: white; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">
      <img src="/logo.png" alt="CertifyPro Logo">
      <div class="logo-text">CertifyPro</div>
    </div>
    <div id="healthStatus" class="status-warn">Connecting...</div>
  </header>

  <main>
    <div id="sidebar">
      <div class="section">
        <div class="section-title">Design Layout</div>
        <label>Certificate Template</label>
        <div class="file-input-box" onclick="document.getElementById('bgUpload').click()">
          <span id="bgFileName" style="color:var(--muted)">Drop or Click to Upload Image</span>
        </div>
        <input type="file" id="bgUpload" accept="image/*" style="display:none">

        <div class="btn-grid">
          <div>
            <label>Font Family</label>
            <select id="fontFamily">
              <option value="Helvetica-Bold">Standard Sans</option>
              <option value="Times-Bold">Classic Serif</option>
              <option value="Courier-Bold">Modern Mono</option>
            </select>
          </div>
          <div>
            <label>Font Size: <span id="szVal">36</span></label>
            <input type="range" id="fontSize" min="10" max="100" value="36">
          </div>
        </div>
        <div style="margin-top:20px;">
          <label>Name Color</label>
          <input type="color" id="fontColor" value="#ffffff" style="padding:4px; border-radius:8px; height:44px; background: rgba(0,0,0,0.3);">
        </div>
        <button class="btn btn-blue" id="btnSaveLayout" style="margin-top:24px;">Publish Design</button>
      </div>

      <div class="section">
        <div class="section-title">Participant Data</div>
        <div class="stat-container">
          <div class="stat-card"><div class="stat-val" id="statPending" style="color:var(--amber)">0</div><div class="stat-label">Pending</div></div>
          <div class="stat-card"><div class="stat-val" id="statSent" style="color:var(--green)">0</div><div class="stat-label">Sent</div></div>
          <div class="stat-card"><div class="stat-val" id="statFailed" style="color:var(--red)">0</div><div class="stat-label">Failed</div></div>
        </div>
        
        <label>Import spreadsheet</label>
        <div class="file-input-box" onclick="document.getElementById('csvUpload').click()">
          <span id="csvFileName" style="color:var(--muted)">Select CSV file</span>
        </div>
        <input type="file" id="csvUpload" accept=".csv" style="display:none">

        <div class="btn-grid">
          <button class="btn btn-ghost" id="btnRefresh">Refresh List</button>
          <button class="btn btn-red" id="btn_clear_data_purge">Reset Data</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Email Settings</div>
        <label>Subject Line</label>
        <input type="text" id="emailSubject" placeholder="Your Certificate is here!">
        <label style="margin-top:20px;">Email Content</label>
        <textarea id="emailBody" rows="4" placeholder="Hi {Name}, congratulations..."></textarea>
        
        <button class="btn btn-green" id="btn_send_batch_dispatch" style="margin-top:24px;">Dispatch All</button>
        <div class="btn-grid" style="margin-top:16px;">
          <button class="btn btn-ghost" id="btnRetry">Retry Errors</button>
          <button class="btn btn-ghost" id="btnResetStatus">Reset Queue</button>
        </div>
      </div>
    </div>

    <!-- Right Panel -->
    <div id="content">
      <div class="panel" id="previewPanel">
        <div style="align-self:flex-start; margin-bottom:20px; font-weight:800; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:0.05em;">Interactive Preview — Drag name to position</div>
        <canvas id="certCanvas" width="850" height="520"></canvas>
      </div>

      <div class="panel" id="tableSection">
        <div id="tableTitle">
          <span style="font-weight:800; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:0.05em;">Participant Registry</span>
          <span id="tableInfo" style="font-size:12px; font-weight:800; color:var(--accent)"></span>
        </div>
        <div id="tableWrap">
          <table>
            <thead><tr><th>#</th><th>Full Name</th><th>Email Address</th><th>Status</th><th>System Feedback</th></tr></thead>
            <tbody id="participantBody"></tbody>
          </table>
          <div id="emptyTable" style="padding:60px; text-align:center; color:var(--muted); font-weight:600;">No participants found. Import a CSV to begin.</div>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="toast"></div>

<script>
// ============================================================
//  STATE
// ============================================================
// x, y are in CANVAS pixels (for rendering).
// When saving/loading from backend, they are converted to RATIOS (0-1).
const S = {
  x: 425, y: 260,
  fontSize: 40, fontFamily: 'Helvetica-Bold', color: '#f8fafc',
  maxWidth: 0.7,
  sampleName: 'Laukik Rathod',
  bgImg: new Image(), bgLoaded: false,
  bgBust: Date.now()
};
let isDragging = false;

// ============================================================
//  CANVAS
// ============================================================
const canvas = document.getElementById('certCanvas');
const ctx    = canvas.getContext('2d');

const FONT_MAP = {
  'Helvetica-Bold':        'Arial, sans-serif',
  'Helvetica':             'Arial, sans-serif',
  'Times-Bold':            'Georgia, serif',
  'Times-Roman':           'Georgia, serif',
  'Courier-Bold':          '"Courier New", monospace',
  'Courier':               '"Courier New", monospace',
  // legacy friendly names
  'Sans':  'Arial, sans-serif',
  'Serif': 'Georgia, serif',
  'Mono':  '"Courier New", monospace',
};

function renderCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // background
  if (S.bgLoaded) {
    ctx.drawImage(S.bgImg, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.font = '600 14px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Upload a certificate template to begin', canvas.width/2, canvas.height/2);
  }
  // name text
  ctx.font = `bold ${S.fontSize}px ${FONT_MAP[S.fontFamily] || 'Arial, sans-serif'}`;
  ctx.fillStyle = S.color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic'; // Matches ReportLab baseline drawing directly
  // shadow for readability
  ctx.shadowColor = 'rgba(0,0,0,0.4)';
  ctx.shadowBlur = 4;
  ctx.fillText(S.sampleName, S.x, S.y);
  ctx.shadowBlur = 0;
  // crosshair dot
  ctx.beginPath();
  ctx.arc(S.x, S.y, 4, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(59,130,246,0.8)';
  ctx.fill();
}

function loadBg() {
  S.bgImg = new Image();
  S.bgImg.onload  = () => { 
    S.bgLoaded = true;
    const aspect = S.bgImg.naturalWidth / S.bgImg.naturalHeight;
    canvas.width = 850;
    canvas.height = 850 / aspect;
    renderCanvas(); 
  };
  S.bgImg.onerror = () => { S.bgLoaded = false; renderCanvas(); };
  S.bgImg.src = `/template-preview?v=${S.bgBust}`;
}

// Drag to position name
canvas.addEventListener('mousedown', e => {
  isDragging = true;
  const r = canvas.getBoundingClientRect();
  S.x = (e.clientX - r.left) * (canvas.width / r.width);
  S.y = (e.clientY - r.top)  * (canvas.height / r.height);
  renderCanvas();
});
canvas.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const r = canvas.getBoundingClientRect();
  S.x = (e.clientX - r.left) * (canvas.width / r.width);
  S.y = (e.clientY - r.top)  * (canvas.height / r.height);
  renderCanvas();
});
window.addEventListener('mouseup', () => isDragging = false);

// ============================================================
//  UI CONTROLS
// ============================================================
document.getElementById('fontFamily').addEventListener('change', e => { S.fontFamily = e.target.value; renderCanvas(); });
document.getElementById('fontSize').addEventListener('input', e => {
  S.fontSize = parseInt(e.target.value);
  document.getElementById('szVal').textContent = S.fontSize;
  renderCanvas();
});
document.getElementById('fontColor').addEventListener('input', e => {
  S.color = e.target.value;
  renderCanvas();
});

// ============================================================
//  TOAST
// ============================================================
let toastTimer;
function toast(msg, isErr=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + (isErr ? 'toast-err' : 'toast-ok');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 4500);
}

// ============================================================
//  ERROR BOX
// ============================================================
function showErr(msg) {
  const el = document.getElementById('errBox');
  el.style.display = 'block';
  el.textContent = '⚠ ' + msg;
}
function clearErr() {
  const el = document.getElementById('errBox');
  el.style.display = 'none';
  el.textContent = '';
}

// ============================================================
//  SPINNER HELPERS
// ============================================================
function setBtnLoading(id, label, loading) {
  const btn = document.getElementById(id);
  btn.disabled = loading;
  btn.innerHTML = loading ? '<span class="spinner"></span> ' + label : label;
}

// ============================================================
//  API: Health check
// ============================================================
async function fetchHealth() {
  try {
    const res  = await fetch('/health');
    const data = await res.json();
    const badge = document.getElementById('healthStatus');
    const smtp  = document.getElementById('smtpStatus');

    if (data.credentials_ok) {
      badge.className = 'status-ok';
      badge.textContent = data.template_set ? '✓ System Ready' : '⚠ Template Missing';
      smtp.style.color = '#10b981';
      smtp.textContent = 'Credentials configured ✓';
    } else {
      badge.className = 'status-warn';
      badge.textContent = '⚠ Missing SMTP Credentials';
      smtp.style.color = '#f59e0b';
      smtp.textContent = 'Set SENDER_EMAIL & APP_PASSWORD in .env';
    }
  } catch { /* ignore */ }
}

// ============================================================
//  API: Status / Participant table
// ============================================================
async function fetchStatus() {
  try {
    const res  = await fetch('/status');
    const rows = await res.json();
    if (!Array.isArray(rows)) return;

    const pending = rows.filter(r => r.status === 'pending').length;
    const sent    = rows.filter(r => r.status === 'sent').length;
    const failed  = rows.filter(r => r.status === 'failed').length;

    document.getElementById('statPending').textContent = pending;
    document.getElementById('statSent').textContent    = sent;
    document.getElementById('statFailed').textContent   = failed;
    
    // Refresh debug count too
    if (document.getElementById('debugDbCount')) {
      document.getElementById('debugDbCount').textContent = rows.length;
    }

    // Update send button label
    const sendBtn = document.getElementById('btn_send_batch_dispatch');
    if (sendBtn && !sendBtn.disabled) {
      sendBtn.textContent = pending > 0 ? `🚀 Generate & Send (${pending} pending)` : '🚀 Generate & Send Emails';
    }

    // Force Laukik Rathod as the layout preview sample name
    S.sampleName = 'Laukik Rathod';
    document.getElementById('previewNameHint').textContent = S.sampleName;
    renderCanvas();

    // Render table
    const tbody = document.getElementById('participantBody');
    const empty = document.getElementById('emptyTable');
    document.getElementById('tableInfo').textContent = rows.length ? `${rows.length} total` : '';

    if (rows.length === 0) {
      tbody.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    tbody.innerHTML = rows.map((r, i) => `
      <tr>
        <td style="color:var(--muted)">${i+1}</td>
        <td title="${esc(r.name)}">${esc(r.name)}</td>
        <td title="${esc(r.email)}" style="color:var(--muted)">${esc(r.email)}</td>
        <td><span class="tag tag-${r.status}">${r.status}</span></td>
        <td title="${esc(r.error_message||'')}" style="color:var(--red);font-size:11px;">${r.error_message ? '⚠ '+r.error_message.substring(0,60) : '—'}</td>
      </tr>`).join('');
  } catch(e) { console.error('fetchStatus', e); }
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ============================================================
//  API: Load layout
// ============================================================
async function fetchLayout() {
  try {
    const res = await fetch('/layout');
    if (!res.ok) return;
    const data = await res.json();

    // color
    if (data.color) { S.color = data.color; document.getElementById('fontColor').value = data.color; }

    // font_size is stored as ratio (0-1) relative to page width.
    // Approximate display: treat canvas width (850) as reference.
    if (data.font_size != null) {
      const fs = parseFloat(data.font_size);
      // If already a ratio (<2), convert to canvas pixels for the slider
      S.fontSize = fs < 2 ? Math.round(fs * 850) : Math.round(fs);
      document.getElementById('fontSize').value = S.fontSize;
      document.getElementById('szVal').textContent = S.fontSize;
    }

    // font_family
    if (data.font_family) {
      S.fontFamily = data.font_family;
      document.getElementById('fontFamily').value = data.font_family;
    }

    // max_width (ratio)
    if (data.max_width != null) S.maxWidth = parseFloat(data.max_width);

    // name_x / name_y are stored as ratios (0-1).
    // Convert to canvas pixel coordinates for rendering.
    if (data.name_x != null && data.name_y != null) {
      S.x = parseFloat(data.name_x) * canvas.width;
      // y_ratio=0 is TOP of page; canvas y=0 is also top — direct mapping
      S.y = parseFloat(data.name_y) * canvas.height;
    }

    renderCanvas();
  } catch(e) { console.error('fetchLayout error', e); }
}

// ============================================================
//  TEMPLATE UPLOAD
// ============================================================
document.getElementById('bgUpload').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  document.getElementById('bgFileName').textContent = file.name;
  e.target.value = '';
  const fd = new FormData(); fd.append('file', file);
  toast('Uploading template…');
  try {
    const res = await fetch('/upload-template', { method: 'POST', body: fd });
    if (res.ok) {
      toast('Template uploaded ✓');
      S.bgBust = Date.now();
      loadBg();
      fetchHealth();
    } else {
      const d = await res.json();
      toast(d.detail || 'Upload failed', true);
    }
  } catch { toast('Network error uploading template', true); }
});

// ============================================================
//  CSV UPLOAD
// ============================================================
document.getElementById('csvUpload').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  document.getElementById('csvFileName').textContent = file.name;
  e.target.value = '';
  const fd = new FormData(); fd.append('file', file);
  toast('Processing CSV…');
  clearErr();
  try {
    const res  = await fetch('/generate-certificates', { method: 'POST', body: fd });
    const data = await res.json();
    if (res.ok) {
      const s = data.summary;
      toast(`CSV processed! ✓ Added/Updated: ${s.generated || s.sent}, Skipped: ${s.skipped}, Failed: ${s.failed}`);
      fetchStatus();
    } else {
      toast(data.detail || 'CSV upload failed', true);
      showErr(data.detail || 'CSV upload failed');
    }
  } catch(err) { toast('Network error processing CSV', true); }
});

// ============================================================
//  PUBLISH LAYOUT
// ============================================================
document.getElementById('btnSaveLayout').addEventListener('click', async () => {
  setBtnLoading('btnSaveLayout', 'Publish Layout →', true);
  try {
    // Convert canvas pixel positions → ratios (0-1) for storage.
    // These ratios are resolution-independent and scale to any PDF template size.
    const xRatio      = S.x / canvas.width;
    const yRatio      = S.y / canvas.height;  // 0=top, 1=bottom
    const sizeRatio   = S.fontSize / canvas.width;  // font size as fraction of width

    const payload = {
      name_x:      xRatio,
      name_y:      yRatio,
      font_size:   sizeRatio,
      font_family: S.fontFamily,
      color:       S.color,
      max_width:   S.maxWidth,
    };

    console.log('[PUBLISH LAYOUT] Sending payload:', payload);

    const res = await fetch('/layout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (res.ok) {
      const result = await res.json();
      console.log('[PUBLISH LAYOUT] Server response:', result);
      toast('Layout saved & all certificates regenerated ✓');
    } else {
      const err = await res.json().catch(() => ({}));
      toast('Layout save failed: ' + (err.detail || res.status), true);
    }
  } catch(e) { 
    console.error('Layout save error', e);
    toast('Layout save network error', true); 
  }
  setBtnLoading('btnSaveLayout', 'Publish Layout →', false);
});

// ============================================================
//  CLEAR ALL DATA (HARD PURGE)
// ============================================================
document.getElementById('btn_clear_data_purge').addEventListener('click', async () => {
  if (!confirm('This will COMPLETELY WIPE the participants list. Continue?')) return;
  try {
    const res = await fetch('/participants', { method: 'DELETE' });
    if (res.ok) { 
      toast('Success: Database cleared'); 
      // Manually reset stats to 0 for instant feedback
      document.getElementById('statPending').textContent = '0';
      document.getElementById('statSent').textContent = '0';
      document.getElementById('statFailed').textContent = '0';
      fetchStatus(); 
    }
  } catch (e) { toast('Purge failed', true); }
});

// ============================================================
//  REFRESH
// ============================================================
document.getElementById('btnRefresh').addEventListener('click', () => { fetchStatus(); toast('Refreshed ✓'); });

// ============================================================
//  DISPATCH EMAILS (BATCH)
// ============================================================
document.getElementById('btn_send_batch_dispatch').addEventListener('click', async () => {
  const pending = +document.getElementById('statPending').textContent;
  if (pending === 0) { toast('No pending participants found.', true); return; }
  if (!confirm(`Ready to send ${pending} certificates?`)) return;

  clearErr();
  setBtnLoading('btn_send_batch_dispatch', 'Dispatching…', true);
  try {
    const res = await fetch('/send-emails', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        subject: document.getElementById('emailSubject').value.trim() || null,
        message_body: document.getElementById('emailBody').value.trim() || null
      })
    });
    if (res.ok) {
      const data = await res.json();
      toast(`Dispatch Done! Sent: ${data.summary.sent}`);
      fetchStatus();
    }
  } catch (e) { toast('Dispatch error', true); }
  setBtnLoading('btn_send_batch_dispatch', '🚀 Generate & Send Emails', false);
});

// ============================================================
//  RETRY FAILED
// ============================================================
document.getElementById('btnRetry').addEventListener('click', async () => {
  const failed = +document.getElementById('statFailed').textContent;
  if (failed === 0) { toast('No failed participants to retry.', true); return; }
  clearErr();
  setBtnLoading('btnRetry', 'Retrying…', true);
  try {
    const res  = await fetch('/retry-failed', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
    const data = await res.json();
    if (res.ok) {
      const s = data.summary;
      toast(`Retry done: Resent ${s.resent_successfully}, Still failed: ${s.still_failed}`);
    } else {
      toast(data.detail || 'Retry failed', true);
    }
  } catch { toast('Network error during retry', true); }
  setBtnLoading('btnRetry', '↺ Retry Failed', false);
  fetchStatus();
});

// ============================================================
//  RESET STATUS
// ============================================================
document.getElementById('btnResetStatus').addEventListener('click', async () => {
  if (!confirm('Mark ALL participants as "pending"? This allows you to re-send certificates to everyone. (Records are NOT deleted)')) return;
  setBtnLoading('btnResetStatus', 'Resetting…', true);
  try {
    const res = await fetch('/reset-status', { method: 'POST' });
    if (res.ok) { toast('All participants reset to pending ✓'); fetchStatus(); }
    else toast('Reset failed', true);
  } catch { toast('Reset network error', true); }
  setBtnLoading('btnResetStatus', '↺ Reset All to Pending', false);
});

// ============================================================
//  DEBUG INFO
// ============================================================
async function fetchDebug() {
  try {
    const res = await fetch('/debug-info');
    const data = await res.json();
    document.getElementById('debugDbPath').textContent = data.db_path;
    document.getElementById('debugDbCount').textContent = data.participant_count;
  } catch(e) { console.error('Debug fetch failed', e); }
}

// ============================================================
//  INIT
// ============================================================
fetchHealth();
fetchLayout();
fetchStatus();
fetchDebug();
loadBg();
renderCanvas();
setInterval(fetchStatus, 5000);
setInterval(fetchHealth, 15000);
</script>
</body>
</html>
