services:
  - type: web
    name: certificate-system
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && cd frontend && npm install && npm run build"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SENDER_EMAIL
        sync: false
      - key: APP_PASSWORD
        sync: false

